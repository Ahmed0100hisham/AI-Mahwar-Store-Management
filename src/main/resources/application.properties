# ==========================================================
#  Al Mahwar Store Management System - نظام إدارة شركة المحور
#  Application configuration
#
#  To override these values without rebuilding, place a copy
#  of this file at:  ./config/application.properties
#  (relative to the folder the application is started from).
# ==========================================================

# ---------- Application ----------
app.name=نظام إدارة شركة المحور
app.name.en=Al Mahwar Store Management System
# The company profile (name, phone, address, logo, footers) is managed in the program: الإعدادات → بيانات الشركة.
# The version comes from Maven (version.properties).
# Arabic texts with Latin digits (u-nu-latn): dates and numbers read the same in pickers, tables and prints
app.locale=ar-KW-u-nu-latn
app.window.width=1280
app.window.height=780
app.window.min-width=1024
app.window.min-height=640
# Open maximized (also forced automatically if the screen is smaller than the size above)
app.window.maximized=false

# ---------- Security / session ----------
# Log out automatically after this many minutes without mouse/keyboard activity (0 = never)
app.session.timeout-minutes=30
# Wrong passwords allowed before an account is locked (stored in the database, all PCs), and for how long
security.login.max-attempts=5
security.login.lock-seconds=300

# ---------- Backup / restore (SQL Server) ----------
# SQL Server itself writes and reads the backup files, on the SQL Server machine: the folder below is a path AS SQL
# SERVER SEES IT (e.g. D:\SQLBackups on the server, \\fileserver\backups, or /var/opt/mssql/backup on Linux /
# Docker) — not a folder of this PC, unless SQL Server runs on this PC. The SQL Server service account needs write
# access to it. Empty = SQL Server's own default backup folder. No credentials here.
# In a properties file write each backslash twice:  backup.server-directory=D:\\SQLBackups
backup.enabled=true
backup.server-directory=
# File names: <prefix>_yyyy-MM-dd_HHmmss.bak (empty = the database name). Backups are never deleted automatically.
backup.file-prefix=

# ---------- Dashboard ----------
# Reload dashboard figures automatically every N seconds while it is open (0 = only on demand)
app.dashboard.refresh-seconds=120

# ---------- Currency ----------
currency.code=KWD
currency.symbol=د.ك
currency.scale=3

# ---------- Database (SQL Server) ----------
# No credentials here (this file is in the source code). Set them on each PC, highest priority first:
#   1. JVM option:            -Ddb.user=...  -Ddb.password=...
#   2. environment variable:  ALMAHWAR_DB_USER / ALMAHWAR_DB_PASSWORD   (any key: ALMAHWAR_ + KEY_IN_CAPS)
#   3. local file:            config/application.properties next to the program (git-ignored)
db.host=localhost
db.port=1433
db.name=AlMahwarDB
db.user=
db.password=
# Use Windows authentication instead of user/password (requires mssql-jdbc_auth DLL on PATH)
db.integrated-security=false
# TLS: the connection is encrypted and the server certificate is validated (it must be trusted by this PC and
# match db.host, or db.host-name-in-certificate). Only a development server with a self-signed certificate may set
# db.trust-server-certificate=true (in its local config file): the program then logs a warning at startup.
db.encrypt=true
db.trust-server-certificate=false
db.host-name-in-certificate=
# Seconds to wait when opening a connection (1-60)
db.login-timeout=5

# ---------- Application log (technical, not the audit log) ----------
# Empty = %LOCALAPPDATA%\\AlMahwar\\logs on Windows (~/.almahwar/logs elsewhere). Rotated; never grows without limit.
app.log.directory=
app.log.max-file-mb=5
app.log.files=5
