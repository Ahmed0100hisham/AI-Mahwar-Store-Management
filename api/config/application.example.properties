# ==========================================================
#  Al Mahwar Store Management API - example local configuration
#
#  Copy to  api/config/application.properties  (git-ignored) and fill in, or set the matching environment variables
#  (ALMAHWAR_DB_HOST, ALMAHWAR_DB_PORT, ALMAHWAR_DB_NAME, ALMAHWAR_DB_USER, ALMAHWAR_DB_PASSWORD,
#   ALMAHWAR_API_JWT_SECRET, ALMAHWAR_API_CORS_ALLOWED_ORIGINS, ALMAHWAR_API_PORT).
#  Never commit the filled-in file. All values below are placeholders.
# ==========================================================

almahwar.db.host=localhost
almahwar.db.port=1433
almahwar.db.name=AlMahwarDB
# A dedicated least-privilege SQL login for the API (see docs/API_ARCHITECTURE.md), never sa
almahwar.db.user=CHANGE_ME
almahwar.db.password=CHANGE_ME
# Development servers with a self-signed certificate only:
# almahwar.db.trust-server-certificate=true

# base64 of at least 32 random bytes; generate one per environment:  openssl rand -base64 48
almahwar.api.jwt.secret=CHANGE_ME

# Browser origins (Flutter Web / tools) only, exact, comma separated. Native apps need none.
# almahwar.api.cors.allowed-origins=http://localhost:5000
