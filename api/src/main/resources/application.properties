# ==========================================================
#  Al Mahwar Store Management API - bundled defaults
#
#  NO credentials or secrets here (this file is in the source code and inside the JAR). Provide them per server,
#  highest priority first:
#    1. environment variables:   ALMAHWAR_DB_USER, ALMAHWAR_DB_PASSWORD, ALMAHWAR_API_JWT_SECRET, ...
#    2. external file:           config/application.properties next to where the API is started (git-ignored)
#  Template: api/config/application.example.properties   Design: docs/API_ARCHITECTURE.md
# ==========================================================

spring.application.name=almahwar-api

# ---------- HTTP ----------
# 8080 is often taken on development machines; behind the TLS reverse proxy in production
server.port=${ALMAHWAR_API_PORT:8085}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# Spring MVC: unknown paths become NoResourceFoundException -> our 404 JSON
spring.mvc.problemdetails.enabled=false
# Only trust X-Forwarded-* headers when deployed behind a known reverse proxy (set in that server's config)
server.forward-headers-strategy=none
spring.servlet.multipart.enabled=false

# ---------- Database (SQL Server, existing schema 1.10.0) ----------
# Same names as the desktop's ALMAHWAR_DB_* variables. Production: a dedicated least-privilege login, never sa.
almahwar.db.host=localhost
almahwar.db.port=1433
almahwar.db.name=AlMahwarDB
almahwar.db.user=
almahwar.db.password=
almahwar.db.encrypt=true
# Only a development server with a self-signed certificate may set this to true (in its local config)
almahwar.db.trust-server-certificate=false
almahwar.db.login-timeout-seconds=5
almahwar.db.max-pool-size=10
# The API never runs SQL scripts (schema.sql / data.sql) against the database: the schema is managed by the desktop's
# database scripts only
spring.sql.init.mode=never

# ---------- API-owned session database (independent schema 1.0.0, no credential fallback) ----------
almahwar.api.db.host=localhost
almahwar.api.db.port=1433
almahwar.api.db.name=AlMahwarApiDB
almahwar.api.db.user=
almahwar.api.db.password=
almahwar.api.db.encrypt=true
almahwar.api.db.trust-server-certificate=${ALMAHWAR_API_DB_TRUST_SERVER_CERTIFICATE:false}
almahwar.api.db.login-timeout-seconds=${ALMAHWAR_API_DB_LOGIN_TIMEOUT_SECONDS:5}
almahwar.api.db.max-pool-size=${ALMAHWAR_API_DB_MAX_POOL_SIZE:10}
almahwar.api.db.host-name-in-certificate=${ALMAHWAR_API_DB_HOST_NAME_IN_CERTIFICATE:}
# Explicit one-time opt-in on an empty, already provisioned API database only. Runtime default is verification only.
almahwar.api.db.initialize=false

# ---------- Tokens ----------
# Required, no default: base64 of >= 32 random bytes, e.g.  openssl rand -base64 48
almahwar.api.jwt.secret=
almahwar.api.jwt.issuer=almahwar-api
almahwar.api.jwt.audience=almahwar-mobile
almahwar.api.jwt.access-token-ttl=15m

# ---------- Login lock (must equal the desktop's security.login.* values: the lock is shared) ----------
almahwar.api.login.max-attempts=5
almahwar.api.login.lock-seconds=300

# ---------- CORS (browser clients only; empty = none). Exact origins, comma separated, never * ----------
almahwar.api.cors.allowed-origins=

# ---------- OpenAPI: off unless the "dev" profile is active ----------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------- Logging: request id in every line; never request bodies, tokens or passwords ----------
logging.pattern.correlation=[%X{requestId:-}]
logging.level.org.springframework.security=INFO
logging.level.com.zaxxer.hikari=WARN
