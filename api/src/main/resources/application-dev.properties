# Development profile (--spring.profiles.active=dev). Never use in production.
# Publishes the OpenAPI description and Swagger UI (http://localhost:8085/swagger-ui.html).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**
