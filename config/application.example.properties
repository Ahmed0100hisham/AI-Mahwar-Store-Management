# ==========================================================
#  Al Mahwar Store Management System — example local configuration
#
#  Copy this file to  config/application.properties  next to the program (that copy is git-ignored and is
#  the only place on a PC that may hold the database password), then replace the placeholders.
#  Every key can instead be given as an environment variable  ALMAHWAR_<KEY>  (dots and dashes as _),
#  e.g. ALMAHWAR_DB_PASSWORD, or as a JVM option  -Ddb.password=...  (highest priority).
#  The program never writes, logs or shows these values.
# ==========================================================

# ---------- SQL Server ----------
# Server name or IP; a named instance as SERVER\\INSTANCE (backslash written twice in this file)
db.host=YOUR_SQL_SERVER
db.port=1433
db.name=AlMahwarDB
# A dedicated least-privilege SQL login for the program (never sa) — see README "Production deployment"
db.user=YOUR_DB_USER
db.password=YOUR_DB_PASSWORD

# TLS: keep encryption on and the certificate validated. Only a development server with a self-signed
# certificate may set db.trust-server-certificate=true.
db.encrypt=true
db.trust-server-certificate=false
# If the certificate is issued for another name than db.host (e.g. the server's full DNS name)
db.host-name-in-certificate=

# ---------- Backups ----------
# A folder ON THE SQL SERVER MACHINE, as SQL Server sees it (not a folder of this PC)
backup.server-directory=D:\\SQLBackups\\AlMahwar

# ---------- Application log ----------
# Empty = %LOCALAPPDATA%\\AlMahwar\\logs
app.log.directory=
